<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Language picker (first launch, or from the header) -->
  <section class="picker" id="picker" hidden>
    <img class="mark mark-lg" src="mark.svg" alt="" aria-hidden="true">
    <h1 class="picker-title" id="picker-title">Which language do you speak?</h1>
    <p class="picker-sub" id="picker-sub">You can change it later.</p>
    <div class="langs" id="langs"></div>
  </section>

  <div class="app" id="app" hidden>
    <header class="top">
      <div class="brand">
        <img class="mark" src="mark.svg" alt="" aria-hidden="true">
        <span>Lectern</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-view="today" data-i18n="today" role="tab">Today</button>
        <button class="tab" data-view="report" data-i18n="report" role="tab">Report</button>
        <button class="tab theme-btn" id="theme-btn" aria-label="Theme">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path class="theme-half" d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/>
          </svg>
        </button>
        <button class="tab lang-btn" id="lang-btn" data-i18n-title="language" title="Language">EN</button>
      </nav>
    </header>

    <main>
      <!-- A newer release on GitHub (only shown when there is one) -->
      <div class="update" id="update" hidden>
        <span class="update-dot" aria-hidden="true"></span>
        <p class="update-text" id="update-text"></p>
        <div class="update-actions">
          <button class="update-btn" id="update-now"></button>
          <button class="update-link" id="update-later"></button>
          <button class="update-link" id="update-skip"></button>
        </div>
      </div>

      <!-- Today -->
      <section class="view" id="view-today">
        <p class="eyebrow" id="today-date"></p>
        <h1 class="timer" id="timer">00:00:00</h1>
        <p class="status" id="status"><span class="dot"></span><span id="status-text"></span></p>

        <div class="subject" id="subject-wrap" hidden>
          <input class="subject-input" id="subject" type="text" maxlength="40" autocomplete="off"
                 list="subject-list" data-i18n-placeholder="subject" spellcheck="false">
          <datalist id="subject-list"></datalist>
        </div>

        <div class="controls" id="controls"></div>

        <div class="week-card">
          <div class="week-head">
            <span class="label"><span data-i18n="thisWeek">This week</span><span class="streak" id="week-streak"></span></span>
            <span class="week-total"><span id="week-total">0h 00m</span><small id="week-goal"></small></span>
          </div>
          <div class="goal-track" id="goal-track" hidden><div class="goal-fill" id="goal-fill"></div></div>
          <div class="strip" id="strip"></div>
          <div class="week-foot">
            <p class="hint" id="week-hint"></p>
            <button class="goal-btn" id="goal-btn"></button>
            <label class="goal-edit" id="goal-edit" hidden>
              <input id="goal-input" type="number" min="1" max="100" step="1" inputmode="numeric">
              <span>h</span>
            </label>
          </div>
        </div>
      </section>

      <!-- Report -->
      <section class="view" id="view-report" hidden>
        <div class="report-nav">
          <button class="arrow" id="prev-week" aria-label="Previous week">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="range">
            <svg class="range-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="2" y="3" width="12" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M2 6.6h12" stroke="currentColor" stroke-width="1.4"/>
              <path d="M5.2 1.6v2.6M10.8 1.6v2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <rect x="4.6" y="8.6" width="2.4" height="2.2" rx=".6" fill="currentColor"/>
            </svg>
            <span class="range-main" id="report-range"></span>
            <span class="range-year" id="report-year"></span>
          </div>
          <button class="arrow" id="next-week" aria-label="Next week">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="notice" id="report-notice" hidden></p>
        <h2 class="report-title" id="report-title"></h2>
        <div class="hero-number">
          <span id="report-total">0h 00m</span>
          <span class="sub" id="report-delta"></span>
        </div>
        <p class="summary" id="report-summary"></p>

        <div class="chart" id="chart"></div>

        <dl class="stats" id="stats"></dl>

        <div class="subjects" id="subjects" hidden>
          <p class="label" data-i18n="bySubject">By subject</p>
          <ul id="subject-rows"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
