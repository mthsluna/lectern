<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span>Lectern</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="today" role="tab">Today</button>
      <button class="tab" data-view="report" role="tab">Report</button>
    </nav>
  </header>

  <main>
    <!-- Today -->
    <section class="view" id="view-today">
      <p class="eyebrow" id="today-date"></p>
      <h1 class="timer" id="timer">00:00:00</h1>
      <p class="status" id="status"><span class="dot"></span><span id="status-text">Ready when you are</span></p>

      <div class="controls" id="controls"></div>

      <div class="week-card">
        <div class="week-head">
          <span class="label">This week</span>
          <span class="week-total" id="week-total">0h 00m</span>
        </div>
        <div class="strip" id="strip"></div>
        <p class="hint" id="week-hint"></p>
      </div>
    </section>

    <!-- Report -->
    <section class="view" id="view-report" hidden>
      <div class="report-nav">
        <button class="arrow" id="prev-week" aria-label="Previous week">&larr;</button>
        <p class="eyebrow" id="report-range"></p>
        <button class="arrow" id="next-week" aria-label="Next week">&rarr;</button>
      </div>
      <p class="notice" id="report-notice" hidden></p>
      <h2 class="report-title" id="report-title">Weekly report</h2>
      <div class="hero-number">
        <span id="report-total">0h 00m</span>
        <span class="sub" id="report-delta"></span>
      </div>
      <p class="summary" id="report-summary"></p>

      <div class="chart" id="chart"></div>

      <dl class="stats" id="stats"></dl>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
