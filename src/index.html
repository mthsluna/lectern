<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Language picker (first launch, or from the header) -->
  <section class="picker" id="picker" hidden>
    <img class="mark mark-lg" src="mark.svg" alt="" aria-hidden="true">
    <h1 class="picker-title" id="picker-title">Which language do you speak?</h1>
    <p class="picker-sub" id="picker-sub">You can change it later.</p>
    <div class="langs" id="langs"></div>
  </section>

  <div class="app" id="app" hidden>
    <header class="top">
      <div class="brand">
        <img class="mark" src="mark.svg" alt="" aria-hidden="true">
        <span>Lectern</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab tab-icon is-active" data-view="today" data-i18n-title="today" data-i18n-label="today" title="Today" aria-label="Today" role="tab">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="11" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 7.6V11l2.3 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 2.3h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="tab tab-icon" data-view="report" data-i18n-title="report" data-i18n-label="report" title="Report" aria-label="Report" role="tab">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4.5 16.5v-5M10 16.5v-12M15.5 16.5v-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="theme-btn" id="theme-btn">
          <svg class="glyph sun" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path class="rays" d="M9.28 4.55 L10.00 0.60 L10.72 4.55Z M12.62 5.16 L15.53 2.40 L13.79 6.01Z M14.96 7.63 L18.94 7.10 L15.41 9.00Z M15.41 11.00 L18.94 12.90 L14.96 12.37Z M13.79 13.99 L15.53 17.60 L12.62 14.84Z M10.72 15.45 L10.00 19.40 L9.28 15.45Z M7.38 14.84 L4.47 17.60 L6.21 13.99Z M5.04 12.37 L1.06 12.90 L4.59 11.00Z M4.59 9.00 L1.06 7.10 L5.04 7.63Z M6.21 6.01 L4.47 2.40 L7.38 5.16Z" fill="currentColor"/>
            <circle class="core" cx="10" cy="10" r="4.1" fill="currentColor"/>
          </svg>
          <svg class="glyph moon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <defs>
              <mask id="moon-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
                <rect width="20" height="20" fill="#fff"/>
                <circle cx="14.4" cy="7" r="6.6" fill="#000"/>
              </mask>
            </defs>
            <circle cx="9.4" cy="10.6" r="7.6" fill="currentColor" mask="url(#moon-cut)"/>
            <path class="sparkle" d="M15.2 2.7 C15.84 4.96 15.84 4.96 18.1 5.6 C15.84 6.24 15.84 6.24 15.2 8.5 C14.56 6.24 14.56 6.24 12.3 5.6 C14.56 4.96 14.56 4.96 15.2 2.7Z" fill="currentColor"/>
          </svg>
        </button>
        <button class="tab lang-btn" id="lang-btn" data-i18n-title="language" title="Language">EN</button>
      </nav>
    </header>

    <main>
      <!-- A newer release on GitHub (only shown when there is one) -->
      <div class="update" id="update" hidden>
        <span class="update-dot" aria-hidden="true"></span>
        <p class="update-text" id="update-text"></p>
        <div class="update-actions">
          <button class="update-btn" id="update-now"></button>
          <button class="update-link" id="update-later"></button>
          <button class="update-link" id="update-skip"></button>
        </div>
      </div>

      <!-- Today -->
      <section class="view" id="view-today">
        <p class="eyebrow" id="today-date"></p>
        <h1 class="timer" id="timer">00:00:00</h1>
        <p class="status" id="status"><span class="dot"></span><span id="status-text"></span></p>

        <div class="subject" id="subject-wrap" hidden>
          <svg class="subject-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 4.6c0-.6.5-1 1-1h3.4c1.1 0 2 .5 2.6 1.3.6-.8 1.5-1.3 2.6-1.3H16c.5 0 1 .4 1 1v9.6c0 .5-.5 1-1 1h-3.4c-1 0-1.9.4-2.6 1.1-.7-.7-1.6-1.1-2.6-1.1H4c-.5 0-1-.5-1-1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 4.9v11" stroke="currentColor" stroke-width="1.5"/></svg>
          <input class="subject-input" id="subject" type="text" maxlength="40" autocomplete="off"
                 data-i18n-placeholder="subject" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggest">
          <ul class="suggest" id="suggest" role="listbox" hidden></ul>
        </div>

        <div class="controls" id="controls"></div>

        <div class="week-card">
          <div class="week-head">
            <span class="label"><span data-i18n="thisWeek">This week</span><span class="streak" id="week-streak"></span></span>
            <span class="week-total"><span id="week-total">0h 00m</span><small id="week-goal"></small></span>
          </div>
          <div class="goal-track" id="goal-track" hidden><div class="goal-fill" id="goal-fill"></div></div>
          <div class="strip-area"><div class="strip" id="strip"></div></div>
          <div class="week-foot">
            <p class="hint" id="week-hint"></p>
            <button class="goal-btn" id="goal-btn"><svg class="target" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <g class="rings">
                <circle cx="12" cy="12" r="9.3" fill="none" stroke="currentColor" stroke-width="2.4"/>
                <circle cx="12" cy="12" r="5.1" fill="none" stroke="currentColor" stroke-width="2.4"/>
                <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
              </g>
              <g transform="translate(12 12) rotate(-45)">
                <g class="arrow">
                  <path d="M1.2 0H11" stroke="var(--bg)" stroke-width="4" stroke-linecap="round"/>
                  <path d="M1.2 0H11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                  <path d="M9.6 0 12.8-3.2h3L13 0l2.8 3.2h-3Z" fill="currentColor" stroke="var(--bg)" stroke-width="1" paint-order="stroke"/>
                </g>
              </g>
            </svg><span id="goal-label"></span></button>
            <label class="goal-edit" id="goal-edit" hidden>
              <span data-i18n="goal">Goal</span>
              <input id="goal-input" type="number" min="1" max="100" step="1" inputmode="numeric">
              <span>h</span>
            </label>
          </div>
        </div>
      </section>

      <!-- Report -->
      <section class="view" id="view-report" hidden>
        <div class="report-nav">
          <button class="arrow" id="prev-week" aria-label="Previous week"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="weeks" id="weeks"></div>
          <button class="arrow" id="next-week" aria-label="Next week"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

          <!-- Calendar: pick any week -->
          <div class="cal" id="cal" role="dialog" hidden>
            <div class="cal-head">
              <button class="cal-nav" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <span class="cal-title" id="cal-title"></span>
              <button class="cal-nav" id="cal-next" aria-label="Next month"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="cal-weekdays" id="cal-weekdays"></div>
            <div class="cal-grid" id="cal-grid"></div>
            <div class="cal-legend">
              <span class="lg"><i class="lg-study"></i><span data-i18n="studiedLegend">Studied</span></span>
              <span class="lg"><i class="lg-today"></i><span data-i18n="today">Today</span></span>
              <span class="lg"><i class="lg-week"></i><span data-i18n="weekLegend">Week</span></span>
            </div>
            <button class="cal-today" id="cal-today" data-i18n="thisWeek">This week</button>
          </div>
        </div>

        <div class="report-body" id="report-body">
        <p class="notice" id="report-notice" hidden></p>
        <h2 class="report-title" id="report-title"></h2>
        <div class="hero-number">
          <span id="report-total">0h 00m</span>
          <span class="sub" id="report-delta"></span>
        </div>
        <p class="summary" id="report-summary"></p>

        <div class="chart" id="chart"></div>
        <div class="day-panel" id="day-panel"></div>

        <dl class="stats" id="stats"></dl>

        <div class="subjects" id="subjects" hidden>
          <p class="label" data-i18n="bySubject">By subject</p>
          <ul id="subject-rows"></ul>
        </div>
        </div>
      </section>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
