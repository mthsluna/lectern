<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectern</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-state="idle">
  <header class="top">
    <div class="brand"><img src="icons/mark.svg" alt="" width="18" height="18"><span>Lectern</span></div>
    <span class="link" id="link"><i></i><span id="link-text"></span></span>
  </header>

  <main>
    <p class="eyebrow" id="date"></p>
    <h1 class="timer" id="timer">00:00:00</h1>
    <div class="pomo-track" id="pomo-track" hidden><div class="pomo-fill" id="pomo-fill"></div></div>
    <p class="status"><span class="dot"></span><span id="status"></span></p>

    <label class="subject" id="subject-wrap" hidden>
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 4.6c0-.6.5-1 1-1h3.4c1.1 0 2 .5 2.6 1.3.6-.8 1.5-1.3 2.6-1.3H16c.5 0 1 .4 1 1v9.6c0 .5-.5 1-1 1h-3.4c-1 0-1.9.4-2.6 1.1-.7-.7-1.6-1.1-2.6-1.1H4c-.5 0-1-.5-1-1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 4.9v11" stroke="currentColor" stroke-width="1.5"/></svg>
      <input id="subject" type="text" maxlength="40" autocomplete="off" spellcheck="false">
    </label>

    <div class="controls" id="controls"></div>

    <section class="week">
      <div class="week-head">
        <span class="label"><span id="week-label"></span><span class="streak" id="streak"></span></span>
        <span class="week-total"><span id="week-total">0h 00m</span><small id="week-goal"></small></span>
      </div>
      <div class="goal-track" id="goal-track" hidden><div class="goal-fill" id="goal-fill"></div></div>
      <div class="strip" id="strip"></div>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="i18n.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
