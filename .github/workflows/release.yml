name: Release build

# Builds the Windows installer on a clean machine and attaches it to an
# existing GitHub release. Run it from the Actions tab after creating a
# release, passing the release's tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installer to, for example v1.6.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build

      - run: npm run build:extension

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist/Lectern-Setup*.exe, dist/Lectern-*-update.gz, dist/Lectern-Extension*.zip | ForEach-Object FullName
          gh release upload "${{ inputs.tag }}" $files --clobber
